services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=realworld_user"
      - "POSTGRES_PASSWORD=realworld_password"
      - "POSTGRES_DB=realworld_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U realworld_user -d realworld_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/realworld_db?user=realworld_user&password=realworld_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        # Build stage
        FROM node:lts-alpine AS builder

        WORKDIR /app

        # Copy package files
        COPY package*.json ./

        # Install all dependencies (including devDependencies for building)
        RUN npm ci

        # Copy source files and TypeScript configuration
        COPY . .

        # Build TypeScript to JavaScript
        RUN npm run build

        # Production stage
        FROM node:lts-alpine

        WORKDIR /app

        # Set environment variables
        ENV NODE_ENV=production
        ENV PORT=3000

        # Copy package files
        COPY package*.json ./

        # Install only production dependencies
        RUN npm ci --only=production && \
            npm cache clean --force

        # Copy built files from builder stage
        COPY --from=builder /app/build ./build

        # Expose the application port
        EXPOSE 3000

        # Start the application  
        CMD ["sh", "-c", "node --unhandled-rejections=strict build/src/Server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000"
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
