services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=test_user"
      - "POSTGRES_PASSWORD=test_password"
      - "POSTGRES_DB=test_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U test_user -d test_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/test_db?user=test_user&password=test_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        # Build stage
        FROM node:lts-alpine AS builder

        WORKDIR /app

        # Copy package files
        COPY package*.json ./

        # Install all dependencies (including devDependencies for building)
        RUN npm ci

        # Copy source code
        COPY . .

        # Patch App.ts to add synchronize option
        RUN sed -i "s/entities: \[__dirname + '\/entities\/\*\.{ts,js}'\],/entities: [__dirname + '\/entities\/*.{ts,js}'], synchronize: true,/" src/App.ts && \
            sed -i 's/app\.listen(process\.env\.PORT);/const server = app.listen(process.env.PORT);/' src/Server.ts

        # Build the application
        RUN npm run build

        # Production stage
        FROM node:lts-alpine

        WORKDIR /app

        # Set environment variables
        ENV NODE_ENV=production
        ENV PORT=3000

        # Copy package files
        COPY package*.json ./

        # Install only production dependencies
        RUN npm ci --only=production && \
            npm cache clean --force

        # Copy built application from builder stage
        COPY --from=builder /app/build ./build

        # Copy scripts directory if needed
        COPY scripts ./scripts

        # Expose the application port
        EXPOSE 3000

        # Start the application
        CMD ["node", "build/src/Server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000"
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
