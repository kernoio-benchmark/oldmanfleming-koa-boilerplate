services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=test_user"
      - "POSTGRES_PASSWORD=test_password"
      - "POSTGRES_DB=test_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U test_user -d test_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/test_db?user=test_user&password=test_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: ${DOCKERFILE_PATH}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - TYPEORM_URL=postgresql://test_user:test_password@postgres:5432/test_db
      - TYPEORM_SYNCHRONIZE=true
      - SECRET=this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
      - PORT=3000
      - NODE_ENV=production
    ports:
      - "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:3000/ || exit 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    labels:
      - jwt-signing-config:HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
